<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VoiceAgent - Demo UI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      #history { border: 1px solid #ddd; padding: 10px; height: 60vh; overflow:auto; }
      .msg { margin-bottom: 8px; }
      .tool { background: #eef; padding: 2px 6px; border-radius:4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h3>VoiceAgent - Support Demo</h3>
    <div id="history"></div>
    <div style="margin-top:10px">
      <select id="mode"><option value="text">Text</option><option value="voice">Voice</option></select>
      <input id="input" style="width:60%" />
      <button id="send">Send</button>
    </div>
    <script>
      const historyEl = document.getElementById('history')
      const input = document.getElementById('input')
      const send = document.getElementById('send')
      const mode = document.getElementById('mode')
      const sessionId = 'demo-session'

      function appendMessage(text, from='agent', tool=null){
        const d = document.createElement('div')
        d.className = 'msg'
        d.innerHTML = `<strong>${from}:</strong> ${text} ${tool?'<span class="tool">'+tool+'</span>':''}`
        historyEl.appendChild(d)
        historyEl.scrollTop = historyEl.scrollHeight
      }

      send.onclick = async ()=>{
        const txt = input.value.trim()
        if(!txt) return
        appendMessage(txt,'user')
        input.value=''
        appendMessage('... thinking ...','agent')
        const res = await fetch('http://localhost:8000/chat',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({session_id: sessionId, message: txt, mode: mode.value})
        })
        const json = await res.json()
        // remove last 'thinking' message
        historyEl.lastChild.remove()
        appendMessage(json.reply,'agent', json.tool_name)
      }
    </script>
  </body>
</html>
